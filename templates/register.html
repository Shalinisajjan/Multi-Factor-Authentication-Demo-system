{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<section class="card narrow"><p class="eyebrow">GET STARTED</p><h1>Create demo account</h1><p class="muted">Use a unique synthetic username and a password of at least 12 characters.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button>Create account</button></form><p class="muted"><a href="{{ url_for('login') }}">Return to sign in</a></p></section>{% endblock %}
